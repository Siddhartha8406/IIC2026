<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">FIELD CRAFT: DESCRIPTION OF GROUND & TACTICAL ZONES</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 1: Classification of Battlefield Terrain and Observation Zones</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- Left: 4 Terrain Types (600px) -->
    <rect width="600" height="510" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">4 MILITARY GROUND CLASSIFICATIONS</text>

    <!-- 1. Broken Ground -->
    <rect x="25" y="65" width="550" height="95" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="45" y="95" fill="#34d399" font-size="15" font-weight="bold">1. BROKEN GROUND (TACTICAL ADVANTAGE)</text>
    <text x="45" y="120" fill="#cbd5e1" font-size="12">Uneven, undulating ground filled with ravines, mounds, and boulder clusters.</text>
    <text x="45" y="140" fill="#94a3b8" font-size="11">● Provides abundant dead ground and natural cover for stalking and offensive approach.</text>

    <!-- 2. Flat Open Ground -->
    <rect x="25" y="175" width="550" height="95" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="45" y="205" fill="#f87171" font-size="15" font-weight="bold">2. FLAT OPEN GROUND (HAZARDOUS KILL ZONE)</text>
    <text x="45" y="230" fill="#cbd5e1" font-size="12">Completely flat, barren terrain without foliage, folds, or depression features.</text>
    <text x="45" y="250" fill="#94a3b8" font-size="11">● Highly exposed to enemy direct fire; cross only at night or with heavy smoke screening.</text>

    <!-- 3. Dead Ground -->
    <rect x="25" y="285" width="550" height="95" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="315" fill="#fbbf24" font-size="15" font-weight="bold">3. DEAD GROUND (CONCEALED DEPRESSION)</text>
    <text x="45" y="340" fill="#cbd5e1" font-size="12">Ground hidden from an observer's direct line of sight due to convex contours or crests.</text>
    <text x="45" y="360" fill="#94a3b8" font-size="11">● Critical blind spots where enemy troops can assemble undetected.</text>

    <!-- 4. High Ground -->
    <rect x="25" y="395" width="550" height="95" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="45" y="425" fill="#60a5fa" font-size="15" font-weight="bold">4. HIGH GROUND (DOMINANT FEATURE)</text>
    <text x="45" y="450" fill="#cbd5e1" font-size="12">Dominant hills, ridges, and vantage knolls commanding surrounding terrain.</text>
    <text x="45" y="470" fill="#94a3b8" font-size="11">● Offers supreme observation, wide fields of fire, and superior tactical leverage.</text>

    <!-- Right: Division of Ground into Zones (550px) -->
    <g transform="translate(630, 0)">
      <rect width="550" height="510" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">3 TACTICAL OBSERVATION ZONES</text>

      <!-- Diagram of 3 Zones -->
      <rect x="30" y="65" width="490" height="110" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="50" y="95" fill="#a5b4fc" font-size="15" font-weight="bold">FOREGROUND (UP TO 300 METERS)</text>
      <text x="50" y="125" fill="#e0e7ff" font-size="12">Immediate weapon engagement zone; riflemen open rapid point fire.</text>
      <text x="50" y="150" fill="#c7d2fe" font-size="11">Anatomical details like facial features and rifles are distinctly recognizable.</text>

      <rect x="30" y="190" width="490" height="110" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="50" y="220" fill="#6ee7b7" font-size="15" font-weight="bold">MIDDLE DISTANCE (300M TO 500 METERS)</text>
      <text x="50" y="250" fill="#d1fae5" font-size="12">LMG / MMG support weapon zone; Section Commander Fire Control Orders.</text>
      <text x="50" y="275" fill="#a7f3d0" font-size="11">Soldier bodies clear as silhouettes but individual features blur.</text>

      <rect x="30" y="315" width="490" height="110" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="50" y="345" fill="#fde68a" font-size="15" font-weight="bold">BACKGROUND (BEYOND 500 METERS)</text>
      <text x="50" y="375" fill="#fef3c7" font-size="12">Mortar, artillery, and long-range observation skyline zone.</text>
      <text x="50" y="400" fill="#fde68a" font-size="11">Human targets appear as tiny posts; vehicle movement detectable.</text>

      <rect x="30" y="440" width="490" height="50" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
      <text x="275" y="470" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">RULE: Always search from Foreground to Background sequentially.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>