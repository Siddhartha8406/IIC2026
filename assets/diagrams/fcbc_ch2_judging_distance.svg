<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">FIELD CRAFT: SIX METHODS OF JUDGING DISTANCE</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 2: Accurate Range Estimation for Sights and Fire Orders</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- 6 Grid Panels -->
    <!-- Method 1: Unit of Measure -->
    <g transform="translate(0, 0)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">1. UNIT OF MEASURE (100M)</text>
      <rect x="20" y="60" width="335" height="60" rx="8" fill="#020617"/>
      <line x1="40" y1="90" x2="330" y2="90" stroke="#0ea5e9" stroke-width="3"/>
      <circle cx="40" cy="90" r="5" fill="#0ea5e9"/>
      <circle cx="330" cy="90" r="5" fill="#0ea5e9"/>
      <text x="185" y="80" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">100-METER YARDSTICK (100 yds)</text>
      <text x="20" y="150" fill="#cbd5e1" font-size="12">Mentally project known 100m football/cricket pitch length between self and target.</text>
      <text x="20" y="210" fill="#38bdf8" font-size="11" font-weight="bold">Limited up to 400m; useless in broken ground.</text>
    </g>

    <!-- Method 2: Appearance Method -->
    <g transform="translate(405, 0)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">2. APPEARANCE METHOD</text>
      <rect x="20" y="55" width="335" height="125" rx="8" fill="#020617" stroke="#1e293b"/>
      <text x="35" y="80" fill="#34d399" font-size="12" font-weight="bold">● 100m: <tspan fill="#e2e8f0" font-weight="normal">Clear facial features &amp; eyes.</tspan></text>
      <text x="35" y="105" fill="#34d399" font-size="12" font-weight="bold">● 200m: <tspan fill="#e2e8f0" font-weight="normal">Rifle parts &amp; skin tone distinct.</tspan></text>
      <text x="35" y="130" fill="#34d399" font-size="12" font-weight="bold">● 300m: <tspan fill="#e2e8f0" font-weight="normal">Body outline clear; faces blur.</tspan></text>
      <text x="35" y="155" fill="#34d399" font-size="12" font-weight="bold">● 400m: <tspan fill="#e2e8f0" font-weight="normal">Figure looks like formless post.</tspan></text>
      <text x="20" y="210" fill="#38bdf8" font-size="11" font-weight="bold">Judged by anatomical clarity of human targets.</text>
    </g>

    <!-- Method 3: Section Average -->
    <g transform="translate(810, 0)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">3. SECTION AVERAGE</text>
      <rect x="20" y="60" width="335" height="75" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="187" y="90" fill="#a5b4fc" font-size="13" font-weight="bold" text-anchor="middle">Average = (C1 + C2 + C3 + ... C8) / 8</text>
      <text x="187" y="115" fill="#e0e7ff" font-size="11" text-anchor="middle">E.g. (250 + 300 + 280 + 310)/4 = 285m</text>
      <text x="20" y="160" fill="#cbd5e1" font-size="12">Averages individual cadet errors out.</text>
      <text x="20" y="210" fill="#38bdf8" font-size="11" font-weight="bold">Used in defense before opening long fire.</text>
    </g>

    <!-- Method 4: Key Range -->
    <g transform="translate(0, 260)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">4. KEY RANGE METHOD</text>
      <text x="20" y="70" fill="#cbd5e1" font-size="12">If distance to a known landmark (e.g. Bridge at 400m) is already known accurately,</text>
      <text x="20" y="110" fill="#cbd5e1" font-size="12">estimate target distance relative to that key range point (e.g. 50m closer = 350m).</text>
      <rect x="20" y="150" width="335" height="40" rx="8" fill="#020617"/>
      <text x="187" y="175" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">Bridge (400m) - 50m = Target (350m)</text>
      <text x="20" y="220" fill="#38bdf8" font-size="11" font-weight="bold">Fastest method for defensive fire cards.</text>
    </g>

    <!-- Method 5: Halving Method -->
    <g transform="translate(405, 260)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">5. HALVING METHOD</text>
      <text x="20" y="70" fill="#cbd5e1" font-size="12">Judge distance to the exact halfway point between self and target, then double it.</text>
      <rect x="20" y="110" width="335" height="50" rx="8" fill="#020617"/>
      <text x="187" y="140" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle">Distance = Halfway Estimate × 2</text>
      <text x="20" y="185" fill="#cbd5e1" font-size="12">Reduces optical estimation error by 50%.</text>
      <text x="20" y="220" fill="#38bdf8" font-size="11" font-weight="bold">Effective up to 600–800m range.</text>
    </g>

    <!-- Method 6: Bracketing Method -->
    <g transform="translate(810, 260)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">6. BRACKETING METHOD</text>
      <text x="20" y="70" fill="#cbd5e1" font-size="12">Establish maximum possible bound and minimum possible bound, then take the mean.</text>
      <rect x="20" y="110" width="335" height="50" rx="8" fill="#020617"/>
      <text x="187" y="140" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Mean = (Min [300m] + Max [500m]) / 2 = 400m</text>
      <text x="20" y="185" fill="#cbd5e1" font-size="12">Ensures errors never exceed bracket bounds.</text>
      <text x="20" y="220" fill="#38bdf8" font-size="11" font-weight="bold">Standard method for mortar / artillery spotting.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>