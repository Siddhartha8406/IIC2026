<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">FIELD CRAFT: CAMOUFLAGE & CONCEALMENT DOCTRINE</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 4: Principles of Cover from View vs Cover from Fire and Personal Camouflage</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- Left: Cover from View vs Fire (600px) -->
    <rect width="600" height="510" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">COVER FROM VIEW VS COVER FROM FIRE</text>

    <!-- Cover from View -->
    <rect x="25" y="65" width="550" height="190" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="95" fill="#fbbf24" font-size="16" font-weight="bold">COVER FROM VIEW (CONCEALMENT ONLY)</text>
    <text x="45" y="125" fill="#cbd5e1" font-size="12">● Hides personnel from enemy direct visual line of sight.</text>
    <text x="45" y="150" fill="#cbd5e1" font-size="12">● <strong style="fill:#ef4444;">CRITICAL VULNERABILITY:</strong> Does NOT stop bullets, shrapnel, or blast fragments.</text>
    <text x="45" y="175" fill="#cbd5e1" font-size="12">● Examples: Bushes, standing crops, tall grass, hedgerows, shadows.</text>
    <text x="45" y="230" fill="#fbbf24" font-size="11" font-weight="bold">Tactical Rule: Use only for temporary concealment while stalking.</text>

    <!-- Cover from Fire -->
    <rect x="25" y="280" width="550" height="200" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="45" y="310" fill="#34d399" font-size="16" font-weight="bold">COVER FROM FIRE (BALLISTIC PROTECTION)</text>
    <text x="45" y="340" fill="#d1fae5" font-size="12">● Physically stops and deflects high-velocity rifle bullets and artillery fragments.</text>
    <text x="45" y="365" fill="#d1fae5" font-size="12">● Provides secure firing platform to engage the enemy with safety.</text>
    <text x="45" y="390" fill="#d1fae5" font-size="12">● Examples: Reinforced concrete parapets, sandbagged trenches, thick rock boulders.</text>
    <text x="45" y="450" fill="#34d399" font-size="11" font-weight="bold">Tactical Rule: Always fight from cover from fire; never fire continuously from bushes.</text>

    <!-- Right: Personal Camouflage Rules (550px) -->
    <g transform="translate(630, 0)">
      <rect width="550" height="510" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">PERSONAL CAMOUFLAGE TECHNIQUES</text>

      <rect x="25" y="65" width="500" height="120" rx="12" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="45" y="95" fill="#a5b4fc" font-size="15" font-weight="bold">1. HELMET &amp; PACK GARNISHING</text>
      <text x="45" y="125" fill="#e0e7ff" font-size="12">● Weave local natural foliage into helmet netting.</text>
      <text x="45" y="150" fill="#e0e7ff" font-size="12">● Replace wilted leaves every 2–3 hours to maintain matching color.</text>
      <text x="45" y="170" fill="#c7d2fe" font-size="11">● Garnish must match immediate surrounding ground (jungle vs scrub).</text>

      <rect x="25" y="205" width="500" height="135" rx="12" fill="#020617" stroke="#1e293b"/>
      <text x="45" y="235" fill="#38bdf8" font-size="15" font-weight="bold">2. FACE &amp; SKIN MATTING</text>
      <text x="45" y="265" fill="#cbd5e1" font-size="12">● Apply dark camouflage cream / charcoal across high points (forehead, nose, cheekbones, chin).</text>
      <text x="45" y="295" fill="#cbd5e1" font-size="12">● Apply lighter tone across shadow areas (eye sockets, under nose/jaw).</text>
      <text x="45" y="320" fill="#94a3b8" font-size="11">● Completely eliminates human facial recognition outline.</text>

      <rect x="25" y="360" width="500" height="120" rx="12" fill="#020617" stroke="#1e293b"/>
      <text x="45" y="390" fill="#34d399" font-size="15" font-weight="bold">3. WEAPON &amp; EQUIPMENT DISGUISE</text>
      <text x="45" y="420" fill="#cbd5e1" font-size="12">● Wrap rifle furniture with hessian cloth or matte green tape.</text>
      <text x="45" y="445" fill="#cbd5e1" font-size="12">● Tape shiny metallic buckles, sling swivels, and watch crystals.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>