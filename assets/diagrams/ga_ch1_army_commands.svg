<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">GENERAL AWARENESS: INDIAN ARMY COMMAND HIERARCHY & HQS</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 1: Apex Leadership, Arms vs Services and 7 Operational Command HQs</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- 7 Operational Commands Grid (700px) -->
    <rect width="700" height="510" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">7 OPERATIONAL COMMANDS OF INDIAN ARMY</text>

    <!-- 7 Command Cards -->
    <g transform="translate(25, 60)">
      <!-- 1. Northern -->
      <rect x="0" y="0" width="310" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="15" y="30" fill="#38bdf8" font-size="13" font-weight="bold">1. Northern Command</text>
      <text x="295" y="30" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Udhampur (J&amp;K)</text>

      <!-- 2. Western -->
      <rect x="0" y="60" width="310" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="15" y="90" fill="#38bdf8" font-size="13" font-weight="bold">2. Western Command</text>
      <text x="295" y="90" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Chandimandir (HR)</text>

      <!-- 3. Eastern -->
      <rect x="0" y="120" width="310" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="15" y="150" fill="#38bdf8" font-size="13" font-weight="bold">3. Eastern Command</text>
      <text x="295" y="150" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Kolkata (WB)</text>

      <!-- 4. Southern -->
      <rect x="0" y="180" width="310" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="15" y="210" fill="#38bdf8" font-size="13" font-weight="bold">4. Southern Command</text>
      <text x="295" y="210" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Pune (MH)</text>

      <!-- 5. Central -->
      <rect x="340" y="0" width="310" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="355" y="30" fill="#38bdf8" font-size="13" font-weight="bold">5. Central Command</text>
      <text x="635" y="30" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Lucknow (UP)</text>

      <!-- 6. South Western -->
      <rect x="340" y="60" width="310" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="355" y="90" fill="#38bdf8" font-size="13" font-weight="bold">6. South Western Cmd</text>
      <text x="635" y="90" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Jaipur (RJ)</text>

      <!-- 7. ARTRAC (Training) -->
      <rect x="340" y="120" width="310" height="50" rx="8" fill="#1e1b4b" stroke="#818cf8"/>
      <text x="355" y="150" fill="#a5b4fc" font-size="13" font-weight="bold">7. ARTRAC (Training)</text>
      <text x="635" y="150" fill="#34d399" font-size="12" font-weight="bold" text-anchor="end">Shimla (HP)</text>

      <!-- Command Pyramid -->
      <rect x="0" y="250" width="650" height="175" rx="12" fill="#020617" stroke="#1e293b"/>
      <text x="20" y="280" fill="#34d399" font-size="14" font-weight="bold">TACTICAL FIELD FORMATIONS HIERARCHY:</text>
      <text x="20" y="310" fill="#cbd5e1" font-size="12">● <strong style="fill:#38bdf8;">Command</strong> (Lt Gen) ➔ <strong style="fill:#38bdf8;">Corps</strong> (Lt Gen) ➔ <strong style="fill:#38bdf8;">Division</strong> (Maj Gen) ➔</text>
      <text x="20" y="340" fill="#cbd5e1" font-size="12">● <strong style="fill:#fbbf24;">Brigade</strong> (Brigadier) ➔ <strong style="fill:#fbbf24;">Battalion</strong> (Colonel) ➔ <strong style="fill:#fbbf24;">Company</strong> (Major)</text>
      <text x="20" y="370" fill="#cbd5e1" font-size="12">● <strong style="fill:#f87171;">Platoon</strong> (JCO / Subedar) ➔ <strong style="fill:#f87171;">Section</strong> (Havildar / 10 Soldiers)</text>
    </g>

    <!-- Right: Arms vs Services Panel (450px) -->
    <g transform="translate(730, 0)">
      <rect width="450" height="510" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">ARMS VS SERVICES</text>

      <rect x="25" y="65" width="400" height="200" rx="12" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="45" y="95" fill="#a5b4fc" font-size="15" font-weight="bold">COMBAT ARMS (FRONTLINE)</text>
      <text x="45" y="125" fill="#e0e7ff" font-size="12">1. <strong style="fill:#818cf8;">Infantry:</strong> Queen of the battlefield; holds ground.</text>
      <text x="45" y="150" fill="#e0e7ff" font-size="12">2. <strong style="fill:#818cf8;">Armoured Corps:</strong> Main battle tanks (Arjun/T-90).</text>
      <text x="45" y="175" fill="#e0e7ff" font-size="12">3. <strong style="fill:#818cf8;">Artillery:</strong> Heavy firepower (Howitzers/Pinaka).</text>
      <text x="45" y="200" fill="#e0e7ff" font-size="12">4. <strong style="fill:#818cf8;">Engineers (Sappers) &amp; Signals:</strong> Combat mobility.</text>
      <text x="45" y="225" fill="#e0e7ff" font-size="12">5. <strong style="fill:#818cf8;">Army Aviation Corps:</strong> Attack helicopters (Rudra/Prachand).</text>

      <rect x="25" y="280" width="400" height="205" rx="12" fill="#064e3b" stroke="#10b981"/>
      <text x="45" y="310" fill="#6ee7b7" font-size="15" font-weight="bold">LOGISTIC SERVICES (BACKBONE)</text>
      <text x="45" y="340" fill="#d1fae5" font-size="12">1. <strong style="fill:#34d399;">ASC (Army Service Corps):</strong> Rations &amp; fuel transport.</text>
      <text x="45" y="365" fill="#34d399" font-size="12">2. <strong style="fill:#34d399;">AOC (Army Ordnance Corps):</strong> Ammo, arms &amp; clothing.</text>
      <text x="45" y="390" fill="#34d399" font-size="12">3. <strong style="fill:#34d399;">EME:</strong> Mechanical engineering &amp; weapons repair.</text>
      <text x="45" y="415" fill="#34d399" font-size="12">4. <strong style="fill:#34d399;">AMC (Army Medical Corps):</strong> Combat casualty care.</text>
      <text x="45" y="440" fill="#34d399" font-size="12">5. <strong style="fill:#34d399;">CMP (Corps of Military Police):</strong> Discipline &amp; pilot escort.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>