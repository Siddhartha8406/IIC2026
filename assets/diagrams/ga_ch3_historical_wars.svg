<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">GENERAL AWARENESS: HISTORICAL WARS & MAJOR MILITARY CAMPAIGNS</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 3: Landmark Conflicts and Victorious Operations of the Indian Armed Forces</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- 5 Major Wars Timeline -->
    <g transform="translate(0, 0)">
      <!-- War 1: 1947-48 -->
      <rect x="0" y="0" width="220" height="490" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="35" rx="8" fill="#020617"/>
      <text x="110" y="38" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">1947–48 KASHMIR</text>
      <text x="20" y="80" fill="#facc15" font-size="12" font-weight="bold">KEY BATTLES:</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="11">● Battle of Badgam</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="11">● Defense of Srinagar Airfield</text>
      <text x="20" y="145" fill="#cbd5e1" font-size="11">● Capture of Zojila Pass</text>
      <text x="20" y="180" fill="#34d399" font-size="12" font-weight="bold">HEROES &amp; MEDALS:</text>
      <text x="20" y="205" fill="#e2e8f0" font-size="11">● Maj Somnath Sharma (1st Param Vir Chakra)</text>
      <text x="20" y="250" fill="#cbd5e1" font-size="11">Saved Kashmir Valley from Pakistani tribal raiders.</text>
    </g>

    <!-- War 2: 1962 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="220" height="490" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="35" rx="8" fill="#020617"/>
      <text x="110" y="38" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">1962 SINO-INDIAN</text>
      <text x="20" y="80" fill="#facc15" font-size="12" font-weight="bold">KEY BATTLES:</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="11">● Battle of Rezang La</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="11">● 13 Kumaon Last Stand</text>
      <text x="20" y="145" fill="#cbd5e1" font-size="11">● Defense of Walong</text>
      <text x="20" y="180" fill="#34d399" font-size="12" font-weight="bold">HEROES &amp; MEDALS:</text>
      <text x="20" y="205" fill="#e2e8f0" font-size="11">● Maj Shaitan Singh, PVC</text>
      <text x="20" y="225" fill="#e2e8f0" font-size="11">● Subedar Joginder Singh, PVC</text>
      <text x="20" y="260" fill="#cbd5e1" font-size="11">Epic valor against overwhelming Chinese numbers at -30°C.</text>
    </g>

    <!-- War 3: 1965 -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="220" height="490" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="35" rx="8" fill="#020617"/>
      <text x="110" y="38" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">1965 INDO-PAK</text>
      <text x="20" y="80" fill="#facc15" font-size="12" font-weight="bold">KEY BATTLES:</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="11">● Battle of Asal Uttar</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="11">● Graveyard of Patton Tanks</text>
      <text x="20" y="145" fill="#cbd5e1" font-size="11">● Capture of Haji Pir Pass</text>
      <text x="20" y="180" fill="#34d399" font-size="12" font-weight="bold">HEROES &amp; MEDALS:</text>
      <text x="20" y="205" fill="#e2e8f0" font-size="11">● CQMH Abdul Hamid, PVC</text>
      <text x="20" y="225" fill="#e2e8f0" font-size="11">● Lt Col AB Tarapore, PVC</text>
      <text x="20" y="260" fill="#cbd5e1" font-size="11">Crippled Pakistani armored corps in the Punjab plains.</text>
    </g>

    <!-- War 4: 1971 -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="220" height="490" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <rect x="15" y="15" width="190" height="35" rx="8" fill="#020617"/>
      <text x="110" y="38" fill="#a5b4fc" font-size="14" font-weight="900" text-anchor="middle">1971 LIBERATION</text>
      <text x="20" y="80" fill="#facc15" font-size="12" font-weight="bold">KEY BATTLES:</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="11">● Battle of Longewala</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="11">● Battle of Basantar</text>
      <text x="20" y="145" fill="#cbd5e1" font-size="11">● Op Trident (Karachi Naval strike)</text>
      <text x="20" y="180" fill="#34d399" font-size="12" font-weight="bold">HEROES &amp; MEDALS:</text>
      <text x="20" y="205" fill="#e2e8f0" font-size="11">● 2/Lt Arun Khetarpal, PVC</text>
      <text x="20" y="225" fill="#e2e8f0" font-size="11">● Flying Officer Nirmal Jit Sekhon (Only IAF PVC)</text>
      <text x="20" y="280" fill="#38bdf8" font-size="11" font-weight="bold">Historic surrender of 93,000 troops; Bangladesh born.</text>
    </g>

    <!-- War 5: 1999 -->
    <g transform="translate(960, 0)">
      <rect x="0" y="0" width="220" height="490" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="35" rx="8" fill="#020617"/>
      <text x="110" y="38" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1999 KARGIL VIJAY</text>
      <text x="20" y="80" fill="#facc15" font-size="12" font-weight="bold">KEY BATTLES:</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="11">● Recapture of Tololing</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="11">● Assault on Tiger Hill</text>
      <text x="20" y="145" fill="#cbd5e1" font-size="11">● Point 4875 Batra Top</text>
      <text x="20" y="180" fill="#34d399" font-size="12" font-weight="bold">HEROES &amp; MEDALS:</text>
      <text x="20" y="205" fill="#e2e8f0" font-size="11">● Capt Vikram Batra, PVC</text>
      <text x="20" y="225" fill="#e2e8f0" font-size="11">● Lt Manoj Pandey, PVC</text>
      <text x="20" y="245" fill="#e2e8f0" font-size="11">● Grenadier Yogender Yadav, PVC</text>
      <text x="20" y="265" fill="#e2e8f0" font-size="11">● Rifleman Sanjay Kumar, PVC</text>
      <text x="20" y="295" fill="#34d399" font-size="11" font-weight="bold">Operation Vijay evicted infiltrators from 16,000+ ft peaks.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>