<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">GENERAL AWARENESS: PARAMILITARY & CENTRAL ARMED POLICE FORCES</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 4: Roles, Mandates and Border Jurisdictions of Indian CAPF Forces</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- 6 CAPF Force Cards in 2x3 Grid -->
    <!-- 1. BSF -->
    <g transform="translate(0, 0)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="16" font-weight="bold">1. BSF (BORDER SECURITY FORCE)</text>
      <text x="20" y="65" fill="#facc15" font-size="12" font-weight="bold">Motto: "Duty Unto Death" (जीवन पर्यन्त कर्तव्य)</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">● Guards international borders with Pakistan and Bangladesh.</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="12">● World's largest border guarding force; camel/riverine patrols.</text>
      <text x="20" y="155" fill="#cbd5e1" font-size="12">● First line of defense during peacetime aggression.</text>
      <text x="20" y="215" fill="#38bdf8" font-size="11" font-weight="bold">Jurisdiction: Indo-Pak &amp; Indo-Bangladesh Borders</text>
    </g>

    <!-- 2. CRPF -->
    <g transform="translate(405, 0)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold">2. CRPF (CENTRAL RESERVE POLICE)</text>
      <text x="20" y="65" fill="#facc15" font-size="12" font-weight="bold">Motto: "Service and Loyalty" (सेवा और निष्ठा)</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">● Primary internal security and counter-insurgency force.</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="12">● Specialized elite units: CoBRA (Commando Battalions for Resolute Action) and RAF (Rapid Action Force for riots).</text>
      <text x="20" y="175" fill="#cbd5e1" font-size="12">● Deployed in Left Wing Extremism (Naxal) &amp; J&amp;K operations.</text>
      <text x="20" y="215" fill="#f87171" font-size="11" font-weight="bold">Role: Internal Security &amp; Anti-Naxal Operations</text>
    </g>

    <!-- 3. CISF -->
    <g transform="translate(810, 0)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="20" y="35" fill="#34d399" font-size="16" font-weight="bold">3. CISF (INDUSTRIAL SECURITY FORCE)</text>
      <text x="20" y="65" fill="#facc15" font-size="12" font-weight="bold">Motto: "Protection and Security" (संरक्षण एवं सुरक्षा)</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">● Guards vital national critical infrastructure:</text>
      <text x="35" y="120" fill="#94a3b8" font-size="11">● 66+ Commercial Airports across India</text>
      <text x="35" y="140" fill="#94a3b8" font-size="11">● Nuclear &amp; Space Installations (ISRO/BARC)</text>
      <text x="35" y="160" fill="#94a3b8" font-size="11">● Delhi Metro Rail Network &amp; Heritage Monuments</text>
      <text x="20" y="215" fill="#34d399" font-size="11" font-weight="bold">Role: Critical Infrastructure &amp; Aviation Security</text>
    </g>

    <!-- 4. ITBP -->
    <g transform="translate(0, 260)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="16" font-weight="bold">4. ITBP (INDO-TIBETAN BORDER POLICE)</text>
      <text x="20" y="65" fill="#facc15" font-size="12" font-weight="bold">Motto: "Valour, Determination, Devotion to Duty"</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">● High-altitude mountain warfare specialists.</text>
      <text x="20" y="125" fill="#cbd5e1" font-size="12">● Patrols 3,488 km of Indo-China border (LAC) from Ladakh to Arunachal Pradesh at 9,000 to 18,700 ft altitudes.</text>
      <text x="20" y="175" fill="#cbd5e1" font-size="12">● Experts in mountaineering and disaster rescue in Himalayas.</text>
      <text x="20" y="215" fill="#38bdf8" font-size="11" font-weight="bold">Jurisdiction: Indo-China Border (LAC)</text>
    </g>

    <!-- 5. SSB -->
    <g transform="translate(405, 260)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="35" fill="#fbbf24" font-size="16" font-weight="bold">5. SSB (SASHASTRA SEEMA BAL)</text>
      <text x="20" y="65" fill="#facc15" font-size="12" font-weight="bold">Motto: "Service, Security and Brotherhood"</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">● Guards open, friendly international borders with Nepal and Bhutan (2,450 km total).</text>
      <text x="20" y="135" fill="#cbd5e1" font-size="12">● Prevents trans-border smuggling, human trafficking, and illegal infiltration while maintaining friendly civic ties.</text>
      <text x="20" y="215" fill="#fbbf24" font-size="11" font-weight="bold">Jurisdiction: Indo-Nepal &amp; Indo-Bhutan Borders</text>
    </g>

    <!-- 6. Assam Rifles -->
    <g transform="translate(810, 260)">
      <rect width="375" height="240" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#a5b4fc" font-size="16" font-weight="bold">6. ASSAM RIFLES ("SENTINELS OF NE")</text>
      <text x="20" y="65" fill="#facc15" font-size="12" font-weight="bold">Motto: "Friends of the Hill People"</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">● India's oldest paramilitary force (raised in 1835 as Cachar Levy).</text>
      <text x="20" y="130" fill="#cbd5e1" font-size="12">● Dual role: Counter-insurgency in Northeast India and guarding the 1,643 km Indo-Myanmar border.</text>
      <text x="20" y="175" fill="#cbd5e1" font-size="12">● Under administrative control of MHA &amp; operational control of Indian Army.</text>
      <text x="20" y="215" fill="#a5b4fc" font-size="11" font-weight="bold">Role: Indo-Myanmar Border &amp; NE Counter-Insurgency</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>