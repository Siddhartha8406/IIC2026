<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">GENERAL AWARENESS: NCC ORGANIZATION & COMMAND PYRAMID</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 6: Apex DGNCC Structure, 17 State Directorates and National Camps</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- Left: NCC Pyramid Hierarchy (650px) -->
    <rect width="650" height="510" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">NCC ADMINISTRATIVE COMMAND PYRAMID</text>

    <g transform="translate(35, 65)">
      <!-- Level 1: HQ DGNCC -->
      <polygon points="290,0 200,60 380,60" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="290" y="40" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">HQ DGNCC (New Delhi)</text>
      <text x="290" y="55" fill="#38bdf8" font-size="10" text-anchor="middle">Headed by Lt General</text>

      <!-- Level 2: 17 State Directorates -->
      <polygon points="200,65 380,65 460,135 120,135" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
      <text x="290" y="95" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">17 STATE DIRECTORATES</text>
      <text x="290" y="118" fill="#facc15" font-size="11" text-anchor="middle">Headed by Major General / Rear Admiral / Air Vice Marshal</text>

      <!-- Level 3: Group HQs -->
      <polygon points="120,140 460,140 530,210 50,210" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="290" y="170" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">GROUP HEADQUARTERS (GHQ)</text>
      <text x="290" y="193" fill="#cbd5e1" font-size="11" text-anchor="middle">Headed by Brigadier / Colonel (approx 95+ Groups across India)</text>

      <!-- Level 4: NCC Battalions / Units -->
      <polygon points="50,215 530,215 570,285 10,285" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
      <text x="290" y="245" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">NCC BATTALIONS / UNITS (ARMY / NAVAL / AIR WINGS)</text>
      <text x="290" y="268" fill="#cbd5e1" font-size="11" text-anchor="middle">Commanding Officer (CO - Colonel / Lt Col)</text>

      <!-- Level 5: Institutions / Colleges -->
      <rect x="0" y="290" width="580" height="70" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
      <text x="290" y="320" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">EDUCATIONAL INSTITUTIONS &amp; ANOs</text>
      <text x="290" y="343" fill="#e2e8f0" font-size="11" text-anchor="middle">Associate NCC Officers (ANO) • Caretaker Officers (CTO) • Senior Under Officers (SUO) • Cadets</text>
    </g>

    <!-- Right: National Integration & Motto (500px) -->
    <g transform="translate(700, 0)">
      <rect width="480" height="510" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">NCC ETHOS &amp; ALL-INDIA CAMPS</text>

      <!-- Motto Card -->
      <rect x="25" y="65" width="430" height="110" rx="12" fill="#1e1b4b" stroke="#818cf8"/>
      <text x="45" y="95" fill="#facc15" font-size="13" font-weight="bold">OFFICIAL MOTTO:</text>
      <text x="45" y="125" fill="#ffffff" font-size="18" font-weight="900">"UNITY AND DISCIPLINE"</text>
      <text x="45" y="150" fill="#a5b4fc" font-size="14" font-weight="bold">एकता और अनुशासन</text>

      <!-- Major Camps Card -->
      <rect x="25" y="190" width="430" height="295" rx="12" fill="#020617" stroke="#1e293b"/>
      <text x="45" y="220" fill="#34d399" font-size="14" font-weight="bold">MAJOR ALL-INDIA ANNUAL CAMPS:</text>
      
      <text x="45" y="250" fill="#38bdf8" font-size="12" font-weight="bold">1. Republic Day Camp (RDC):</text>
      <text x="45" y="270" fill="#cbd5e1" font-size="11">Prestigious national camp in New Delhi; PM's Rally &amp; Kartavya Path parade.</text>

      <text x="45" y="300" fill="#38bdf8" font-size="12" font-weight="bold">2. Thal Sainik Camp (TSC):</text>
      <text x="45" y="320" fill="#cbd5e1" font-size="11">Army wing obstacle courses, shooting matches, map reading &amp; tent pitching.</text>

      <text x="45" y="350" fill="#38bdf8" font-size="12" font-weight="bold">3. Ek Bharat Shreshtha Bharat (EBSB):</text>
      <text x="45" y="370" fill="#cbd5e1" font-size="11">Inter-directorate cultural exchange celebrating India's rich linguistic diversity.</text>

      <text x="45" y="400" fill="#38bdf8" font-size="12" font-weight="bold">4. Youth Exchange Programme (YEP):</text>
      <text x="45" y="420" fill="#cbd5e1" font-size="11">International goodwill delegations representing India in friendly foreign nations.</text>

      <text x="45" y="455" fill="#facc15" font-size="11" font-weight="bold">NCC Act XXXI passed in Parliament in 1948.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>