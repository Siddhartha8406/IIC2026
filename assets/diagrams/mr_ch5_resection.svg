<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0f18; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="#060b13"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Header Banner -->
  <rect x="24" y="24" width="1232" height="90" rx="16" fill="url(#headerGrad)"/>
  <text x="50" y="65" fill="#38bdf8" font-size="24" font-weight="900" letter-spacing="2" font-family="'Arial Black', sans-serif">MAP READING: BEARING RESECTION & POSITION FIX</text>
  <text x="50" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">Chapter 5: 3-Point Back Bearing Triangulation to Pinpoint Patrol Ground Location</text>
  <rect x="1100" y="45" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1165" y="66" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TACTICAL PLATE</text>

  <!-- Body Content -->
  
  <g transform="translate(50, 130)">
    <!-- Left: Map Coordinate Canvas (700px) -->
    <rect width="700" height="510" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Known Landmarks -->
    <!-- Landmark A: Hill 412 -->
    <circle cx="180" cy="100" r="16" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
    <text x="180" y="140" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">Landmark A: Hill 412</text>
    <text x="180" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">(FB measured: 310° -> BB: 130°)</text>

    <!-- Landmark B: Temple Tower -->
    <circle cx="560" cy="110" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="560" y="150" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Landmark B: Temple Tower</text>
    <text x="560" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">(FB measured: 045° -> BB: 225°)</text>

    <!-- Landmark C: Bridge -->
    <circle cx="520" cy="440" r="16" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <text x="520" y="475" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">Landmark C: River Bridge</text>
    <text x="520" y="495" fill="#94a3b8" font-size="11" text-anchor="middle">(FB measured: 120° -> BB: 300°)</text>

    <!-- Ray Lines to Patrol Position -->
    <!-- Intersection at (330, 310) -->
    <line x1="180" y1="100" x2="330" y2="310" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="560" y1="110" x2="330" y2="310" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="520" y1="440" x2="330" y2="310" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- Triangle of Error / Position Fix -->
    <polygon points="325,305 338,308 330,318" fill="rgba(239, 68, 68, 0.4)" stroke="#ef4444" stroke-width="2"/>
    <circle cx="331" cy="310" r="6" fill="#ef4444"/>
    <rect x="230" y="325" width="200" height="30" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="330" y="345" fill="#c7d2fe" font-size="12" font-weight="bold" text-anchor="middle">PINPOINT FIX: GR 423687</text>

    <!-- Right: Calculation & Doctrine Panel (450px) -->
    <g transform="translate(730, 0)">
      <rect width="450" height="510" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="30" y="40" fill="#38bdf8" font-size="18" font-weight="800">RESECTION PROCEDURE</text>

      <rect x="25" y="60" width="400" height="120" rx="12" fill="#020617" stroke="#0ea5e9" stroke-width="1"/>
      <text x="40" y="85" fill="#facc15" font-size="14" font-weight="bold">BACK BEARING (BB) RULES:</text>
      <text x="40" y="115" fill="#e2e8f0" font-size="13">● If FB &lt; 180° : <tspan fill="#38bdf8" font-weight="bold">BB = FB + 180°</tspan></text>
      <text x="40" y="145" fill="#e2e8f0" font-size="13">● If FB &gt; 180° : <tspan fill="#38bdf8" font-weight="bold">BB = FB - 180°</tspan></text>
      <text x="40" y="170" fill="#94a3b8" font-size="11">Example: FB 045° + 180° = 225° BB</text>

      <text x="30" y="215" fill="#f1f5f9" font-size="14" font-weight="bold">3-STEP EXECUTION PROTOCOL:</text>
      <text x="30" y="245" fill="#cbd5e1" font-size="12">1. Identify 3 distinct landmarks visible on ground &amp; map.</text>
      <text x="30" y="275" fill="#cbd5e1" font-size="12">2. Take magnetic forward bearings with Prismatic Compass.</text>
      <text x="30" y="305" fill="#cbd5e1" font-size="12">3. Convert to Grid Back Bearings and draw rays backward.</text>
      <text x="30" y="335" fill="#cbd5e1" font-size="12">4. Intersection forms Triangle of Error; centroid is position.</text>

      <rect x="25" y="370" width="400" height="110" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="40" y="395" fill="#a5b4fc" font-size="13" font-weight="bold">INTERSECTION VS RESECTION:</text>
      <text x="40" y="420" fill="#e0e7ff" font-size="12">● <strong style="fill:#818cf8;">Intersection:</strong> From 2 known positions to find UNKNOWN target.</text>
      <text x="40" y="445" fill="#e0e7ff" font-size="12">● <strong style="fill:#818cf8;">Resection:</strong> From UNKNOWN position targeting 3 KNOWN points.</text>
      <text x="40" y="470" fill="#38bdf8" font-size="11" font-weight="bold">Essential survival technique for lost reconnaissance patrols.</text>
    </g>
  </g>
  

  <!-- Footer -->
  <line x1="40" y1="675" x2="1240" y2="675" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="695" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">PROJECT PROMETHEUS • NCC ANO TRAINING COMMAND • OFFICIAL INSTRUCTIONAL DOCTRINE</text>
  <text x="1230" y="695" fill="#64748b" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">OFFLINE VECTOR ASSET</text>
</svg>